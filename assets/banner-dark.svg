<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Terminal: whoami prints robert, junior developer at PC CADDIE">
  <style>
    svg{--bg:#151b23;--bd:#3d444d;--fg:#f0f6fc;--mu:#9198a1;--ok:#3fb950;--ac:#4493f8;--grass:#3fb950;--flag:#f85149;--ball:#f0f6fc;--hole:#010409}
    text{font:18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--fg)}
    .t{font-size:13px;fill:var(--mu)}
    .p{fill:var(--ok)} .m{fill:var(--mu)} .a{fill:var(--ac)}
    .win{fill:var(--bg);stroke:var(--bd)}
    .bd{stroke:var(--bd)}
    .cur{fill:var(--bg)}
    .show{opacity:0;animation:show .01s forwards}
    .caret{fill:var(--fg);opacity:0;animation:show .01s 4.3s forwards,blink 1s 4.3s step-end infinite}
    .flag{fill:var(--flag);transform-origin:900px 188px;animation:wave 1.4s ease-in-out infinite alternate}
    .ball{fill:var(--ball);stroke:var(--fg);stroke-width:1;opacity:0;animation:putt 5s 4.6s ease-out infinite}
    @keyframes show{to{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes type{from{transform:translateX(0)}to{transform:translateX(var(--w))}}
    @keyframes wave{to{transform:scaleX(.8) skewY(4deg)}}
    @keyframes putt{
      0%{opacity:0;transform:translate(0,0)}
      6%{opacity:1}
      55%{opacity:1;transform:translate(124px,0)}
      62%{opacity:0;transform:translate(128px,6px)}
      100%{opacity:0;transform:translate(128px,6px)}
    }
  </style>

  <rect class="win" x="1" y="1" width="998" height="298" rx="12"/>
  <line class="bd" x1="1" y1="40" x2="999" y2="40"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text class="t" x="500" y="25" text-anchor="middle">robert@pccaddie: ~</text>

  <!-- commands are typed by sliding a background-coloured curtain off them, one character per step -->
  <text x="32" y="82"><tspan class="p">$</tspan> whoami</text>
  <rect class="cur" x="52" y="64" width="67" height="26" style="--w:67px;animation:type .6s .3s steps(6) both"/>
  <text class="show" x="32" y="112" style="animation-delay:1.1s">robert — junior developer @ <tspan class="a">PC CADDIE</tspan> ⛳</text>

  <text x="32" y="152"><tspan class="p">$</tspan> cat likes.txt</text>
  <rect class="cur" x="52" y="134" width="143" height="26" style="--w:143px;animation:type .9s 1.5s steps(13) both"/>
  <text class="show m" x="32" y="182" style="animation-delay:2.6s">native apps · discord bots · trading · music · travel</text>

  <text x="32" y="222"><tspan class="p">$</tspan> ls ~/projects</text>
  <rect class="cur" x="52" y="204" width="143" height="26" style="--w:143px;animation:type .9s 3s steps(13) both"/>
  <text class="show a" x="32" y="252" style="animation-delay:4.1s">storage-manager/<tspan dx="32">nexo/</tspan></text>

  <text x="32" y="282" class="show" style="animation-delay:4.3s"><tspan class="p">$</tspan></text>
  <rect class="caret" x="54" y="267" width="11" height="20"/>

  <!-- tiny putting green, because the day job is golf software -->
  <ellipse cx="880" cy="262" rx="100" ry="16" style="fill:var(--grass)" opacity=".18"/>
  <ellipse cx="900" cy="262" rx="11" ry="3.5" style="fill:var(--hole)"/>
  <line x1="900" y1="262" x2="900" y2="178" style="stroke:var(--mu)" stroke-width="2.5" stroke-linecap="round"/>
  <path class="flag" d="M900 178 L938 188 L900 198 Z"/>
  <circle class="ball" cx="776" cy="256" r="6"/>
</svg>
